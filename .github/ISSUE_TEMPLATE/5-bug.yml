name: Bug report
description: Something does not work as expected. Security problems go to the private report instead (see SECURITY.md).
title: 'Bug: '
labels: ['type: bug']
body:
  - type: dropdown
    id: area
    attributes:
      label: Ownership area
      options:
        - 'Area 1: Integration Core + platform base'
        - 'Area 2: Workflow automation'
        - 'Area 3: Attendance, leave and reporting'
        - 'Area 4: Governance, security and monitoring'
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - 'S1: blocks a demo or loses data'
        - 'S2: a feature does not work and there is no workaround'
        - 'S3: a feature misbehaves, with a workaround'
        - 'S4: cosmetic'
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include the error message and the traceId from the error panel if there is one.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as the HR_SG demo user
        2. Open Employees
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: docker compose / local dev, browser and version, language (EN or 中文), theme
  - type: checkboxes
    id: data
    attributes:
      label: Data check
      options:
        - label: This report contains synthetic data only (no real personal data, secrets or licence keys).
          required: true
