name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Mermaid CLI's browser is only needed for `pnpm diagrams:build`, not in CI.
  PUPPETEER_SKIP_DOWNLOAD: 'true'

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: huitong
          POSTGRES_PASSWORD: huitong_ci_only
          POSTGRES_DB: huitong_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U huitong -d huitong_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8.8.3-alpine3.23
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # API integration tests migrate and seed this database in their global setup.
      TEST_DATABASE_URL: postgresql://huitong:huitong_ci_only@localhost:5432/huitong_test
      TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Dependency audit
        run: pnpm audit --audit-level high
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and integration tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Web bundle budget (initial JS at most 250 KB gzip)
        run: pnpm --filter @huitong/web budget

  docker:
    name: Docker images
    runs-on: ubuntu-24.04
    needs: verify
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build every service image
        run: docker compose build
