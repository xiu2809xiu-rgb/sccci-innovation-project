name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Mermaid CLI's browser is only needed for `pnpm diagrams:build`, not in CI.
  PUPPETEER_SKIP_DOWNLOAD: 'true'

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: huitong
          POSTGRES_PASSWORD: huitong_ci_only
          POSTGRES_DB: huitong_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U huitong -d huitong_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8.8.3-alpine3.23@sha256:0b2b77d3ea5078274795e3177cdbdada8b96316684a38911d528534ed679b5ec
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # API integration tests migrate and seed this database in their global setup.
      TEST_DATABASE_URL: postgresql://huitong:huitong_ci_only@localhost:5432/huitong_test
      TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Dependency audit
        run: pnpm audit --audit-level high
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and integration tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Web bundle budget (initial JS at most 250 KB gzip)
        run: pnpm --filter @huitong/web budget

  docker:
    name: Docker images
    runs-on: ubuntu-24.04
    needs: verify
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build every service image
        run: docker compose build
      # Container scanning: a fixable HIGH or CRITICAL vulnerability in any image fails the build.
      - name: Scan the API image (also installs Trivy for the next step)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: image
          image-ref: huitong-api:latest
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: '1'
          cache: true
      - name: Scan the web and mock images
        run: |
          for image in web mock-sg-hr mock-cn-hq mock-oa; do
            trivy image --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 "huitong-${image}:latest"
          done
