name: Scorecard

# OpenSSF Scorecard: supply-chain practices (pinned dependencies, branch
# protection, token permissions, dangerous workflows...). The results are
# published to the Scorecard API and shown in the Security tab. The API only
# accepts results from a workflow that follows its restrictions, so this job
# stays alone in its own file with read-only workflow permissions.
on:
  push:
    branches: [main]
  schedule:
    - cron: '27 4 * * 1'
  branch_protection_rule:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: scorecard.sarif
          category: scorecard
