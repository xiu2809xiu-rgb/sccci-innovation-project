name: Security

# Infrastructure-as-code and Dockerfile misconfiguration scanning (Trivy).
# Image vulnerability scanning runs in the CI workflow, right after the images
# are built; the supply-chain review is in scorecard.yml.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 03:47 UTC, after the CodeQL run.
    - cron: '47 3 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config:
    name: IaC and Dockerfile scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy misconfiguration scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: config
          scan-ref: .
          skip-dirs: node_modules
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-config.sarif
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: always()
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config
