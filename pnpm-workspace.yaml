packages:
  - apps/*
  - services/*
  - packages/*

# CLAUDE.md section 5: pin exact versions.
savePrefix: ''

# Supply-chain hardening: ignore versions published less than a day ago.
minimumReleaseAge: 1440

# eslint-plugin-jsx-a11y 6.10.2 predates ESLint 10 but its rules run correctly on
# it (verified with probe files); allow the newer peer instead of downgrading ESLint.
peerDependencyRules:
  allowedVersions:
    eslint-plugin-jsx-a11y>eslint: '10'

# Dependency build scripts are denied unless reviewed here (pnpm fails the
# install on unreviewed builds). Each entry was checked before allowing it.
allowBuilds:
  # Verifies and links the platform-specific binary (used by tsx).
  esbuild: true
  # Downloads the schema engine used by `prisma migrate`.
  '@prisma/engines': true
  # Node and environment checks before the CLI installs.
  prisma: true
  # Loads the prebuilt native binding (compiles only if none matches).
  argon2: true
  # Selects BullMQ's prebuilt msgpack accelerator; a pure-JS fallback exists.
  msgpackr-extract: true
  # Install-time telemetry (via swagger-ui-dist); no functional effect.
  '@scarf/scarf': false
  # Downloads Chrome for Puppeteer. The diagram build (scripts/build-diagrams.mjs)
  # drives the Chromium that Playwright already installs, so no second browser.
  puppeteer: false

# Forced versions. Each entry needs a reason and a review date.
overrides:
  # Marp CLI 4.5.1 (the slide build) asks for puppeteer-core ^24, whose browser-download
  # helpers bring extract-zip and basic-ftp advisories with no fix in the 24 line.
  # Puppeteer 25, which the diagram build already uses, has neither. The slide build
  # passes --browser-path and was checked to export all three formats with it.
  # Drop this when Marp CLI moves to Puppeteer 25. Review: 2026-12-01.
  '@marp-team/marp-cli>puppeteer-core': 25.14.0
  # speech-rule-engine (Marp's MathJax) pins @xmldom/xmldom 0.9.10; 0.9.12 is the patch
  # release that fixes its advisories. Drop this when it asks for 0.9.12. Review: 2026-12-01.
  'speech-rule-engine>@xmldom/xmldom': 0.9.12
  # Express 5 (the mocks, and the API through @nestjs/platform-express) resolves body-parser
  # 2.3.0, open to a denial of service through trailing bytes after a compressed body
  # (GHSA-27r3-jxmh-p828); 2.4.0 fixes it inside express's own ^2 range. Drop this when the
  # lockfile resolves 2.4.0 or later without it. Review: 2026-12-01.
  'express>body-parser': 2.4.0
  # @nestjs/platform-express 12.1.3 resolves multer 2.4.0, open to a denial of service through
  # a pending asynchronous fileFilter (GHSA-q7qp-rjg7-q26m); 2.5.0 fixes it. Multer parses the
  # file uploads (the mapping wizard and the file import). Drop this when Nest depends on
  # multer 2.5.0 or later. Review: 2026-12-01.
  '@nestjs/platform-express>multer': 2.5.0

# Accepted advisories. Each entry needs a reason and a review date.
auditConfig:
  ignoreGhsas:
    # braces <=3.0.3 stack exhaustion on deeply nested, attacker-supplied glob patterns;
    # no patched version exists. Reached only through the shadcn CLI (dev tooling that
    # globs our own files); nothing from it ships in the web bundle. Review: 2026-12-01.
    - GHSA-vfj7-8cjw-p6xm
